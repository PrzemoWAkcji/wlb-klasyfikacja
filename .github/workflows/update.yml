name: Odświeżenie klasyfikacji

on:
  schedule:
    # czas UTC: niedziela 19:00 i 21:00 (wieczór po rundzie), środa 19:00 (korekty po protestach)
    - cron: "0 19 * * 0"
    - cron: "0 21 * * 0"
    - cron: "0 19 * * 3"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*.py", "template.html", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wlb-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # surowe wyniki z Roster trzymamy w cache Actions, żeby nie pobierać co raz całej historii
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: wlb-raw-${{ github.run_id }}
          restore-keys: wlb-raw-

      - name: Pobierz wyniki i przelicz klasyfikację
        id: update
        run: |
          python update.py | tee update.log
          echo "status=$(tail -n 1 update.log)" >> "$GITHUB_OUTPUT"

      - name: Zapisz zmiany w repozytorium
        if: steps.update.outputs.status == 'ZMIANA'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html data/plan.json data/data.sha256
          git commit -m "Aktualizacja klasyfikacji $(date -u +%Y-%m-%d)" || exit 0
          git push

      # GitHub wyłącza harmonogram po 60 dniach bez commitów – w przerwie wakacyjnej robimy pusty commit
      - name: Podtrzymanie harmonogramu
        if: steps.update.outputs.status != 'ZMIANA'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Podtrzymanie harmonogramu"
            git push
          fi

      - uses: actions/configure-pages@v5
        if: steps.update.outputs.status == 'ZMIANA' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.update.outputs.status == 'ZMIANA' || github.event_name != 'schedule'
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        if: steps.update.outputs.status == 'ZMIANA' || github.event_name != 'schedule'
